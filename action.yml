name: "AgentScan"
description: "Detects automation patterns on GitHub"
author: "Matteo Gabriele"
inputs:
  github-token:
    description: "GitHub token"
    required: true
  skip-members:
    description: "List of usernames to skip from scanning. Can use array syntax in workflow YAML."
    required: false
    default: ""
  agent-scan-comment:
    description: "Whether to enable AgentScan commenting on the issue or PR. True by default. You can disable this if you only want to use the outputs and not have the action comment on the issue or PR."
    required: false
    default: "true"
  skip-comment-on-organic:
    description: "Skip posting comment on PR or issue if analysis result is 'organic'"
    required: false
    default: "false"
  cache-path:
    description: "Path to cache directory (e.g., '.agentscan-cache') - if provided, analysis results will be cached"
    required: false
    default: ""
  label-community-flagged:
    description: "Label to add when an account is flagged by the community"
    required: false
    default: "agentscan:community-flagged"
  label-mixed:
    description: "Label to add when an account has mixed automation signals"
    required: false
    default: "agentscan:mixed-signals"
  label-automation:
    description: "Label to add when an account is classified as automated"
    required: false
    default: "agentscan:automated-account"
  auto-close:
    description: "Whether to automatically close issues/PRs for detected automations"
    required: false
    default: "false"
  auto-close-classifications:
    description: "Comma-separated list of classifications that trigger auto-close (organic, mixed, automation). Defaults to 'automation'. Can use array syntax in workflow YAML."
    required: false
    default: "automation"
  message-organic:
    description: "Custom message to display when account is classified as organic. If not provided, default message will be used."
    required: false
    default: ""
  message-mixed:
    description: "Custom message to display when account has mixed automation signals. If not provided, default message will be used."
    required: false
    default: ""
  message-automation:
    description: "Custom message to display when account is classified as automated. If not provided, default message will be used."
    required: false
    default: ""
  message-community-flagged:
    description: "Custom message to display when account is flagged by the community. If not provided, default message will be used."
    required: false
    default: ""
outputs:
  flagged:
    description: "Whether the account was flagged"
  classification:
    description: "Classification result: organic, mixed, or automation"
  score:
    description: "Numeric score from 0 to 100"
  community-flagged:
    description: "Whether the account is on the community verified automations list"
  flags:
    description: "JSON array of flag objects with label, points, and detail"
  account-age:
    description: "Account age in days"
  username:
    description: "The GitHub username that was analyzed"
branding:
  icon: "activity"
  color: "white"
runs:
  using: "node24"
  main: "dist/index.mjs"
