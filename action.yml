# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: "AgentScan"
description: "Detects automation patterns on GitHub"
author: "Matteo Gabriele"
inputs:
  github-token:
    description: "GitHub token"
    required: true
  allowed-users:
    description: "List of usernames to skip from scanning. Can use array syntax in workflow YAML."
    required: false
    default: ""
  trusted-author-associations:
    description: "List of author associations to skip from scanning (collaborator, contributor, first_timer, first_time_contributor, member, owner). Can use array syntax in workflow YAML."
    required: false
    default: ""
  scan-pull-requests:
    description: "Whether to analyze pull request authors. True by default."
    required: false
    default: "true"
  scan-issues:
    description: "Whether to analyze issue authors. False by default."
    required: false
    default: "false"
  mode:
    description: "How AgentScan should act on its findings: 'full' (comment and labels), 'labels' (labels only), 'comment' (comment only), or 'silent' (outputs only, no comment or labels)."
    required: false
    default: "full"
  comment-on-organic:
    description: "Whether to post a comment when the analysis result is 'organic'. False by default."
    required: false
    default: "false"
  cache-path:
    description: "Path to cache directory (e.g., '.agentscan-cache') - if provided, analysis results will be cached"
    required: false
    default: ""
  label-community-flagged:
    description: "Label to add when an account is flagged by the community"
    required: false
    default: "agentscan:community-flagged"
  label-mixed:
    description: "Label to add when an account has mixed automation signals"
    required: false
    default: "agentscan:mixed-signals"
  label-automation:
    description: "Label to add when an account is classified as automated"
    required: false
    default: "agentscan:automated-account"
  auto-close:
    description: "Whether to automatically close issues/PRs for detected automations"
    required: false
    default: "false"
  auto-close-classifications:
    description: "Comma-separated list of classifications that trigger auto-close (organic, mixed, automation). Defaults to 'automation'. Can use array syntax in workflow YAML."
    required: false
    default: "automation"
  message-organic:
    description: "Custom message to display when account is classified as organic. If not provided, default message will be used."
    required: false
    default: ""
  message-mixed:
    description: "Custom message to display when account has mixed automation signals. If not provided, default message will be used."
    required: false
    default: ""
  message-automation:
    description: "Custom message to display when account is classified as automated. If not provided, default message will be used."
    required: false
    default: ""
  message-community-flagged:
    description: "Custom message to display when account is flagged by the community. If not provided, default message will be used."
    required: false
    default: ""
  honeypot:
    description: "Whether to post a greeting comment carrying an instruction only automated readers act on, and flag the author when they reply with it. Requires the workflow to also run on issue_comment events."
    required: false
    default: "false"
  message-honeypot:
    description: "Custom greeting for the honeypot comment. Supports {username} and {type} placeholders. If not provided, a default greeting will be used."
    required: false
    default: ""
  message-honeypot-first-time:
    description: "Custom honeypot greeting for a first-time contributor to the repository. Falls back to 'message-honeypot' when left blank."
    required: false
    default: ""
outputs:
  flagged:
    description: "Whether the account was flagged"
  classification:
    description: "Classification result: organic, mixed, or automation"
  score:
    description: "Numeric score from 0 to 100"
  community-flagged:
    description: "Whether the account is on the community verified automations list"
  flags:
    description: "JSON array of flag objects with label, points, and detail"
  account-age:
    description: "Account age in days"
  username:
    description: "The GitHub username that was analyzed"
  honeypot-triggered:
    description: "Whether the author replied with the honeypot verification code. Only set on issue_comment runs."
branding:
  icon: "activity"
  color: "white"
runs:
  using: "node24"
  main: "dist/index.mjs"
