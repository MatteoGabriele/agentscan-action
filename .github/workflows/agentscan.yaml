name: AgentScan

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  agentscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
